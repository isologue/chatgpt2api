services:
  # PostgreSQL 仅供 Compose 内网使用，不向宿主机暴露端口。
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatgpt2api}
      POSTGRES_USER: ${POSTGRES_USER:-chatgpt2api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - postgres16_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    image: ghcr.io/basketikun/chatgpt2api:latest
    container_name: chatgpt2api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:80"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      # 存储后端配置 (可选值: json, sqlite, postgres, git)
      - STORAGE_BACKEND=${STORAGE_BACKEND:-postgres}
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-chatgpt2api}:${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chatgpt2api}}
      
      # 数据库配置 (当 STORAGE_BACKEND=sqlite/postgres 时使用)
      # - DATABASE_URL=postgresql://user:password@host:5432/dbname
      # - DATABASE_URL=sqlite:////app/data/accounts.db
      
      # Git 仓库配置 (当 STORAGE_BACKEND=git 时使用)
      # - GIT_REPO_URL=https://github.com/user/repo.git
      # - GIT_TOKEN=ghp_xxxxxxxxxxxx
      # - GIT_BRANCH=main
      # - GIT_FILE_PATH=accounts.json
      
      # 认证密钥 (可选，覆盖 config.json)
      # - CHATGPT2API_AUTH_KEY=your_secret_key
      
      # 基础 URL (可选)
      # - CHATGPT2API_BASE_URL=https://your-domain.com

volumes:
  postgres16_data:
